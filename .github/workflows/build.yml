name: Unit tests

# Only unit tests run remotely. Build, verifier and manual checks run locally.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The build downloads Rider 2026.3 as the compile dependency: the default runner disk is too small otherwise
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
