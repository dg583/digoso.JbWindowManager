name: Unit tests

# Only IDE-free unit tests run remotely (project `ci/`, no Rider download). Build, verifier and the platform tests run locally.
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p ci test
