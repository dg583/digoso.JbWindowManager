<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#323F52" />
      <stop offset="100%" stop-color="#273140" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A8CFF" />
      <stop offset="100%" stop-color="#006EE6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B51E0" />
      <stop offset="100%" stop-color="#7B32C9" />
    </linearGradient>
    <linearGradient id="mixGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B51E0" />
      <stop offset="100%" stop-color="#147CE5" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B57" />
      <stop offset="100%" stop-color="#E54D3A" />
    </linearGradient>
  </defs>

  <!-- Vollflächiger Hintergrund ohne abgerundete Ecken -->
  <rect width="40" height="40" fill="url(#bgGrad)" />

  <!-- Äußerer Fensterrahmen -->
  <rect x="8.5" y="9.5" width="23" height="23" rx="1" stroke="#CBD5E1" stroke-width="1.3" />

  <!-- Vertikale Haupttrennung & horizontale Teilungen -->
  <line x1="16" y1="9.5" x2="16" y2="32.5" stroke="#CBD5E1" stroke-width="1.3" />
  <line x1="16" y1="16.8" x2="31.5" y2="16.8" stroke="#CBD5E1" stroke-width="1.3" />
  <line x1="16" y1="24.6" x2="31.5" y2="24.6" stroke="#CBD5E1" stroke-width="1.3" />
  <line x1="23.8" y1="16.8" x2="23.8" y2="32.5" stroke="#CBD5E1" stroke-width="1.3" />

  <!-- Linker Hauptbereich -->
  <rect x="10.2" y="11.2" width="4.1" height="19.6" rx="0.4" fill="url(#blueGrad)" />

  <!-- Oberer breiter Bereich rechts -->
  <rect x="17.7" y="11.2" width="12.1" height="3.9" rx="0.4" fill="url(#purpleGrad)" />

  <!-- Mittlere Reihe rechts -->
  <rect x="17.7" y="18.5" width="4.4" height="4.4" rx="0.4" fill="url(#blueGrad)" />
  <rect x="25.5" y="18.5" width="4.3" height="4.4" rx="0.4" fill="url(#coralGrad)" />

  <!-- Untere Reihe rechts -->
  <rect x="17.7" y="26.3" width="4.4" height="4.5" rx="0.4" fill="url(#mixGrad)" />
  <rect x="25.5" y="26.3" width="4.3" height="4.5" rx="0.4" fill="url(#blueGrad)" />

  <!-- Preset / Bookmark-Badge oben rechts -->
  <g transform="translate(26.5, 6.2)">
    <!-- Dunkler Rahmen für sauberen Kontrast über den Linien -->
    <path d="M-0.8 -0.8 H7.8 V10.4 L3.5 7.4 L-0.8 10.4 Z" fill="#273140" />
    <!-- Bookmark-Banner -->
    <path d="M0 0 H7 V9.2 L3.5 6.7 L0 9.2 Z" fill="url(#coralGrad)" />
    <!-- Stern -->
    <polygon points="3.5,1.6 4.1,2.8 5.4,3.0 4.45,3.9 4.7,5.2 3.5,4.6 2.3,5.2 2.55,3.9 1.6,3.0 2.9,2.8" fill="#FFFFFF" />
  </g>
</svg>